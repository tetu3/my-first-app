<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>横スクロール アクションゲーム</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Noto Sans JP", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #030617, #08193c 45%, #120f3d);
      color: #f2f9ff;
    }

    .game-shell {
      width: min(96vw, 980px);
      padding: 24px;
      border-radius: 24px;
      background: rgba(6, 9, 24, 0.88);
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(104, 197, 255, 0.16);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 2.4vw, 2.2rem);
    }

    p {
      margin: 0 0 16px;
      line-height: 1.6;
      color: #cfe0ff;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px;
      border: 2px solid rgba(96, 190, 255, 0.24);
      background: linear-gradient(180deg, #031022 0%, #092147 45%, #0f214d 100%);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    button {
      margin-top: 12px;
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      background: linear-gradient(90deg, #4cb7ff, #2f7cff);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(47, 124, 255, 0.25);
    }

    button:hover { transform: translateY(-1px); }
  </style>
</head>
<body>
  <main class="game-shell">
    <h1>横スクロール アクションゲーム</h1>
    <p>スペースまたは↑キーでジャンプ。コインを集めてスコアを伸ばし、障害物に当たるとゲームオーバーです。</p>
    <canvas id="game" width="960" height="360"></canvas>
    <div class="hud">
      <span id="score">スコア: 0</span>
      <span id="best">ベスト: 0</span>
    </div>
    <button id="restart">もう一度遊ぶ</button>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const restartBtn = document.getElementById("restart");

    const GRAVITY = 0.45;
    const JUMP_FORCE = -10.5;
    const GROUND_Y = canvas.height - 60;
    const PLAYER_W = 34;
    const PLAYER_H = 44;

    let player = {
      x: 120,
      y: GROUND_Y - PLAYER_H,
      vy: 0,
      width: PLAYER_W,
      height: PLAYER_H,
      grounded: true,
    };

    let obstacles = [];
    let coins = [];
    let score = 0;
    let bestScore = Number(localStorage.getItem("sideScrollBest") || 0);
    let spawnTimer = 0;
    let coinTimer = 0;
    let speed = 4.2;
    let gameOver = false;
    let lastTime = 0;

    const keys = { jump: false };

    function resetGame() {
      player = {
        x: 120,
        y: GROUND_Y - PLAYER_H,
        vy: 0,
        width: PLAYER_W,
        height: PLAYER_H,
        grounded: true,
      };
      obstacles = [];
      coins = [];
      score = 0;
      spawnTimer = 0;
      coinTimer = 0;
      speed = 4.2;
      gameOver = false;
      lastTime = 0;
    }

    function jump() {
      if (player.grounded && !gameOver) {
        player.vy = JUMP_FORCE;
        player.grounded = false;
      }
    }

    function spawnObstacle() {
      const type = Math.random() > 0.55 ? "block" : "spike";
      const height = type === "block" ? 32 : 28;
      obstacles.push({
        x: canvas.width + 24,
        y: GROUND_Y - height,
        width: type === "block" ? 30 : 26,
        height,
        type,
      });
    }

    function spawnCoin() {
      coins.push({
        x: canvas.width + 24,
        y: GROUND_Y - 68 - Math.random() * 70,
        radius: 10,
      });
    }

    function update(delta) {
      if (gameOver) {
        updateHud();
        return;
      }

      score += delta * 0.12;
      speed += delta * 0.0015;
      spawnTimer -= delta;
      coinTimer -= delta;

      if (spawnTimer <= 0) {
        spawnObstacle();
        spawnTimer = 70 + Math.random() * 40;
      }

      if (coinTimer <= 0) {
        spawnCoin();
        coinTimer = 110 + Math.random() * 70;
      }

      player.vy += GRAVITY;
      player.y += player.vy;

      if (player.y >= GROUND_Y - player.height) {
        player.y = GROUND_Y - player.height;
        player.vy = 0;
        player.grounded = true;
      } else {
        player.grounded = false;
      }

      obstacles.forEach((obstacle) => {
        obstacle.x -= speed + delta * 0.04;
      });

      coins.forEach((coin) => {
        coin.x -= speed + delta * 0.03;
      });

      obstacles = obstacles.filter((obstacle) => obstacle.x + obstacle.width > -20);
      coins = coins.filter((coin) => coin.x + coin.radius > -20);

      for (const obstacle of obstacles) {
        const hit =
          player.x < obstacle.x + obstacle.width &&
          player.x + player.width > obstacle.x &&
          player.y < obstacle.y + obstacle.height &&
          player.y + player.height > obstacle.y;

        if (hit) {
          gameOver = true;
          bestScore = Math.max(bestScore, Math.floor(score));
          localStorage.setItem("sideScrollBest", String(bestScore));
          break;
        }
      }

      for (let i = coins.length - 1; i >= 0; i -= 1) {
        const coin = coins[i];
        const hit = Math.hypot(player.x + player.width / 2 - coin.x, player.y + player.height / 2 - coin.y) < 24;
        if (hit) {
          score += 16;
          coins.splice(i, 1);
        }
      }

      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = `スコア: ${Math.floor(score)}`;
      bestEl.textContent = `ベスト: ${bestScore}`;
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, "#05102d");
      sky.addColorStop(0.4, "#0c1f52");
      sky.addColorStop(1, "#071428");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(255,255,255,0.15)";
      for (let i = 0; i < 40; i += 1) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * 120;
        const radius = Math.random() * 1.7 + 0.8;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.strokeStyle = "rgba(90, 190, 255, 0.16)";
      ctx.lineWidth = 1;
      for (let y = GROUND_Y - 24; y < canvas.height; y += 24) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
      for (let x = 0; x < canvas.width; x += 48) {
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y - 24);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      ctx.fillStyle = "#113460";
      ctx.beginPath();
      ctx.moveTo(0, 280);
      ctx.lineTo(180, 220);
      ctx.lineTo(320, 260);
      ctx.lineTo(450, 210);
      ctx.lineTo(610, 250);
      ctx.lineTo(760, 215);
      ctx.lineTo(960, 270);
      ctx.lineTo(960, 360);
      ctx.lineTo(0, 360);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#0c1233";
      for (let x = 80; x < canvas.width; x += 180) {
        ctx.beginPath();
        ctx.moveTo(x, 280);
        ctx.lineTo(x + 36, 240);
        ctx.lineTo(x + 72, 274);
        ctx.lineTo(x + 54, 296);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = "#142a52";
      ctx.fillRect(0, GROUND_Y, canvas.width, 60);
      ctx.fillStyle = "rgba(55, 190, 255, 0.18)";
      ctx.fillRect(0, GROUND_Y + 36, canvas.width, 6);
    }

    function drawPlayer() {
      const gradient = ctx.createLinearGradient(player.x, player.y, player.x, player.y + player.height);
      gradient.addColorStop(0, "#33b1ff");
      gradient.addColorStop(1, "#0c4be2");
      ctx.fillStyle = gradient;
      ctx.fillRect(player.x, player.y, player.width, player.height);

      ctx.fillStyle = "rgba(255,255,255,0.8)";
      ctx.fillRect(player.x + 6, player.y + 10, 6, 6);
      ctx.fillRect(player.x + 22, player.y + 12, 6, 6);
      ctx.strokeStyle = "rgba(68, 199, 255, 0.85)";
      ctx.lineWidth = 3;
      ctx.strokeRect(player.x + 2, player.y + 6, player.width - 4, player.height - 12);
    }

    function drawObstacles() {
      obstacles.forEach((obstacle) => {
        if (obstacle.type === "block") {
          ctx.fillStyle = "#28538f";
          ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
          ctx.strokeStyle = "rgba(84, 185, 255, 0.55)";
          ctx.lineWidth = 2;
          ctx.strokeRect(obstacle.x + 2, obstacle.y + 2, obstacle.width - 4, obstacle.height - 4);
        } else {
          ctx.fillStyle = "#d56cff";
          ctx.beginPath();
          ctx.moveTo(obstacle.x, obstacle.y + obstacle.height);
          ctx.lineTo(obstacle.x + obstacle.width / 2, obstacle.y);
          ctx.lineTo(obstacle.x + obstacle.width, obstacle.y + obstacle.height);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.35)";
          ctx.fillRect(obstacle.x + obstacle.width * 0.35, obstacle.y + obstacle.height * 0.4, obstacle.width * 0.3, obstacle.height * 0.45);
        }
      });
    }

    function drawCoins() {
      coins.forEach((coin) => {
        const glow = ctx.createRadialGradient(coin.x, coin.y, coin.radius * 0.2, coin.x, coin.y, coin.radius * 1.8);
        glow.addColorStop(0, "rgba(167, 255, 255, 0.9)");
        glow.addColorStop(1, "rgba(20, 175, 255, 0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(coin.x, coin.y, coin.radius * 1.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#68d8ff";
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#8edcff";
        ctx.stroke();
      });
    }

    function drawOverlay() {
      if (!gameOver) return;
      ctx.fillStyle = "rgba(4, 8, 17, 0.55)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fdfdfd";
      ctx.font = "bold 44px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("ゲームオーバー", canvas.width / 2, canvas.height / 2 - 12);
      ctx.font = "24px 'Segoe UI', sans-serif";
      ctx.fillText("Enter または 画面タップで再挑戦", canvas.width / 2, canvas.height / 2 + 28);
      ctx.textAlign = "left";
    }

    function draw() {
      drawBackground();
      drawCoins();
      drawObstacles();
      drawPlayer();
      drawOverlay();
    }

    function loop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const delta = Math.min(2.2, (timestamp - lastTime) / 16.67);
      lastTime = timestamp;
      update(delta);
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", (event) => {
      if (event.code === "Space" || event.code === "ArrowUp") {
        event.preventDefault();
        jump();
      }
      if (event.code === "Enter" && gameOver) {
        resetGame();
      }
    });

    canvas.addEventListener("pointerdown", () => {
      if (gameOver) {
        resetGame();
      } else {
        jump();
      }
    });

    restartBtn.addEventListener("click", resetGame);

    updateHud();
    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
